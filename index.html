<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Mothership — Retrofit</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>

    <!-- HUD overlay -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <span id="score-label">SCORE <strong id="score">0</strong></span>
        <span id="beamed-label">BEAMED <strong id="beamed">0</strong></span>
      </div>
      <div class="hud-center">
        <span id="mode-label">SHED</span>
        <span id="district" class="hidden">Chilliwack</span>
      </div>
      <div class="hud-right">
        <span id="prompt-label"></span>
        <button type="button" id="mute-btn" title="Mute">🔊</button>
      </div>
    </div>

    <!-- Title: vintage car stereo + cassette insert -->
    <div id="screen-title" class="screen">
      <div class="stereo-wrap">
        <div class="car-stereo" id="car-stereo" aria-label="Vintage car stereo">
          <div class="stereo-face">
            <div class="stereo-knob stereo-knob-l" aria-hidden="true">
              <span class="knob-mark"></span>
            </div>
            <div class="stereo-mid">
              <div class="stereo-brand">DELCO · AM/FM · STEREO</div>
              <div class="stereo-display" id="stereo-display">
                <span class="stereo-eq" aria-hidden="true"></span>
                <span class="stereo-lcd">INSERT TAPE</span>
              </div>
              <div class="cassette-slot" id="cassette-slot">
                <div class="slot-lip"></div>
                <div class="slot-dark"></div>
                <div class="slot-hint" id="slot-hint">▲ INSERT / START</div>
              </div>
              <div class="stereo-buttons" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>
            <div class="stereo-knob stereo-knob-r" aria-hidden="true">
              <span class="knob-mark"></span>
            </div>
          </div>
          <button type="button" id="menu-cassette" class="menu-cassette" aria-label="Insert cassette — Retrofit Mothership the game">
            <span class="tape-shell">
              <span class="tape-window">
                <span class="reel reel-l"></span>
                <span class="reel reel-r"></span>
              </span>
              <span class="tape-label">
                <span class="tape-side">A</span>
                <span class="tape-title">Retrofit — Mothership the game</span>
              </span>
            </span>
          </button>
        </div>
        <p class="stereo-stats">
          <span class="highscore" id="title-high">High Score: 0</span>
          <span class="play-count" id="play-count">Plays: …</span>
        </p>
      </div>
    </div>

    <!-- Results screen -->
    <div id="screen-results" class="screen hidden">
      <div class="panel results-panel">
        <h2>MISSION DEBRIEF</h2>
        <p class="results-line">Beamed: <strong id="res-beamed">0</strong> Chilliwackians</p>
        <p class="results-line">Score: <strong id="res-score">0</strong></p>
        <p class="results-line high" id="res-high-wrap">High Score: <strong id="res-high">0</strong></p>
        <p class="one-liner" id="res-liner">The mothership needs more fried chicken.</p>
        <button type="button" id="btn-again" class="btn primary">FLY AGAIN</button>
        <button type="button" id="btn-title" class="btn">TITLE</button>
      </div>
    </div>

    <!-- Touch controls -->
    <div id="touch" class="hidden">
      <div class="pad" id="pad-left">
        <button type="button" data-dir="left" aria-label="Left">◀</button>
        <div class="pad-mid">
          <button type="button" data-dir="up" aria-label="Up / Jump / Interact">▲</button>
          <button type="button" data-dir="down" aria-label="Down">▼</button>
        </div>
        <button type="button" data-dir="right" aria-label="Right">▶</button>
      </div>
      <div class="touch-actions">
        <button type="button" id="btn-interact" aria-label="Interact">USE</button>
        <button type="button" id="btn-beam" aria-label="Beam">BEAM</button>
      </div>
    </div>
  </div>

  <audio id="theme-audio" src="assets/mothership-theme.mp3" playsinline webkit-playsinline loop preload="auto"></audio>
  <script src="js/audio.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
